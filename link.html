<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Links</title>

<style>
body{
    margin:0;
    padding:0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#3b82f6,#1e3a8a);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    width:90%;
    max-width:800px;
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

h1{
    text-align:center;
    color:#1e3a8a;
    margin-bottom:25px;
}

ul{
    list-style:none;
    padding:0;
}

li{
    background:#eff6ff;
    margin:12px 0;
    padding:15px;
    border-radius:12px;
    transition:0.3s;
    border-left:6px solid #2563eb;
}

li:hover{
    transform:translateX(8px);
    background:#dbeafe;
}

a{
    text-decoration:none;
    color:#1d4ed8;
    font-weight:bold;
    word-break:break-all;
}

.number{
    display:inline-block;
    width:30px;
    height:30px;
    line-height:30px;
    text-align:center;
    background:#2563eb;
    color:white;
    border-radius:50%;
    margin-right:10px;
}
</style>
</head>

<body>

<div class="container">

<h1>Links List</h1>

<ul>
    <li><span class="number">1</span><a href="http://tieuhoctrungphung.edu.vn/thu-vien/sach-giao-khoa/sach-giao-khoa-lop-3/tin-hoc-3-kntt.html" target="_blank">Tin học 3 KNTT</a></li>

    <li><span class="number">2</span><a href="https://www.youtube.com" target="_blank">https://www.youtube.com</a></li>

    <li><span class="number">3</span><a href="https://www.facebook.com" target="_blank">https://www.facebook.com</a></li>

    <li><span class="number">4</span><a href="https://www.wikipedia.org" target="_blank">https://www.wikipedia.org</a></li>

    <li><span class="number">5</span><a href="https://www.github.com" target="_blank">https://www.github.com</a></li>

    <li><span class="number">6</span><a href="https://www.stackoverflow.com" target="_blank">https://www.stackoverflow.com</a></li>

    <li><span class="number">7</span><a href="https://openai.com" target="_blank">https://openai.com</a></li>

    <li><span class="number">8</span><a href="https://chatgpt.com" target="_blank">https://chatgpt.com</a></li>

    <li><span class="number">9</span><a href="https://www.microsoft.com" target="_blank">https://www.microsoft.com</a></li>

    <li><span class="number">10</span><a href="https://www.apple.com" target="_blank">https://www.apple.com</a></li>
</ul>

</div>

</body>
</html>
